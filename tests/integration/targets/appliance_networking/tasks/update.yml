---
# ============================================================
# APPLIANCE_NETWORKING UPDATE (state=present) TESTS
# ============================================================

# Test 1: Enable IPv6 when it is currently disabled (change expected)
- name: Reset before update expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for update (IPv6 disabled state)
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Appliance.Networking_get: "200"
        Appliance.Networking_update: "204"

- name: Enable IPv6 on all interfaces
  vmware.vmware_rest.appliance_networking:
    ipv6_enabled: true
    state: present
  register: enable_ipv6

- name: Assert IPv6 enablement reports a change
  ansible.builtin.assert:
    that:
      - enable_ipv6.changed
      - enable_ipv6.diff.ipv6_enabled.before == false
      - enable_ipv6.diff.ipv6_enabled.after == true

# Test 2: Enable IPv6 again when it is already enabled (idempotent)
- name: Reset before idempotent update expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for updated state (IPv6 enabled)
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/updated.json"
      operationsAndResponses:
        Appliance.Networking_get: "200"
        Appliance.Networking_update: "204"

- name: Enable IPv6 again (idempotent)
  vmware.vmware_rest.appliance_networking:
    ipv6_enabled: true
    state: present
  register: enable_ipv6_again

- name: Assert no change when IPv6 is already enabled
  ansible.builtin.assert:
    that:
      - not enable_ipv6_again.changed
      - enable_ipv6_again.diff == {}

# Test 3: Omitting ipv6_enabled leaves the configuration unchanged
- name: Reset before no-op update expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for no-op update
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Appliance.Networking_get: "200"

- name: Apply present without ipv6_enabled
  vmware.vmware_rest.appliance_networking:
    state: present
  register: present_noop

- name: Assert no change when ipv6_enabled is omitted
  ansible.builtin.assert:
    that:
      - not present_noop.changed
      - present_noop.diff == {}

# Test 4: Check mode when the update would cause a change
- name: Reset before check mode update expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for check mode (IPv6 disabled state)
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Appliance.Networking_get: "200"

- name: Enable IPv6 in check mode (when would change)
  vmware.vmware_rest.appliance_networking:
    ipv6_enabled: true
    state: present
  check_mode: true
  register: enable_ipv6_check

- name: Assert check mode reports change when updating
  ansible.builtin.assert:
    that:
      - enable_ipv6_check.changed
      - enable_ipv6_check.diff.ipv6_enabled.after == true

# Test 5: Check mode when no update is needed
- name: Reset before idempotent check mode expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for check mode (IPv6 enabled state)
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/updated.json"
      operationsAndResponses:
        Appliance.Networking_get: "200"

- name: Enable IPv6 in check mode (when already enabled)
  vmware.vmware_rest.appliance_networking:
    ipv6_enabled: true
    state: present
  check_mode: true
  register: enable_ipv6_check_idem

- name: Assert check mode reports no change when already enabled
  ansible.builtin.assert:
    that:
      - not enable_ipv6_check_idem.changed
      - enable_ipv6_check_idem.diff == {}
